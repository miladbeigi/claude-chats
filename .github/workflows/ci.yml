name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  lint:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
          bundler-cache: true
      - run: bundle exec rubocop

  install:
    name: install from a clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.10'
      # The README tells people to clone and run `rake install`, so prove that
      # works with nothing but a checkout and a Ruby.
      - run: rake install
      - run: claude-chats --version

      - name: list a Claude home with no chats
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR/projects"
          claude-chats --list
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/empty-claude-home

      - name: report a missing Claude home instead of crashing
        run: |
          if claude-chats --list; then
            echo "expected a non-zero exit for a missing Claude home"
            exit 1
          fi
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/no-such-claude-home
